<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ontyra{% endblock %} · Ontyra</title>
<style>
:root { --bg:#fbfbfa; --fg:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --card:#fff; --accent:#2f5d50;
  --ok:#2e7d32; --bad:#b3261e; --warn:#a15c00; --code:#f1f1ec; }
@media (prefers-color-scheme: dark) { :root { --bg:#161715; --fg:#e8e8e3; --muted:#9a9a92;
  --line:#2c2d2a; --card:#1d1e1b; --accent:#7fb8a4; --ok:#7bc47f; --bad:#f2837b; --warn:#e0a458;
  --code:#252622; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
header { display:flex; gap:20px; align-items:center; padding:12px max(16px, calc((100% - 1000px) / 2 + 16px)); border-bottom:1px solid var(--line);
  background:var(--card); flex-wrap:wrap; }
header b { letter-spacing:.04em; }
nav a { color:var(--muted); text-decoration:none; margin-right:16px; padding:4px 0; }
nav a.on, nav a:hover { color:var(--fg); border-bottom:2px solid var(--accent); }
main { max-width:1000px; margin:0 auto; padding:24px 16px 64px; }
h1 { font-size:22px; margin:0 0 16px; } h2 { font-size:17px; margin:28px 0 10px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:0 0 12px; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.muted { color:var(--muted); } .small { font-size:13px; }
.tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
.tag.must { color:var(--bad); border-color:var(--bad); } .tag.ok { color:var(--ok); border-color:var(--ok); }
.tag.warn { color:var(--warn); border-color:var(--warn); }
table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
a { color:var(--accent); }
code, pre { background:var(--code); border-radius:4px; font:13px ui-monospace,monospace; }
code { padding:1px 5px; } pre { padding:10px 12px; overflow:auto; margin:6px 0 0; white-space:pre-wrap; word-break:break-word; }
input, select, button, textarea { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
input[type=text] { min-width:260px; }
button { cursor:pointer; } button.go { background:var(--accent); color:var(--bg); border-color:var(--accent); }
button.no { color:var(--bad); border-color:var(--bad); }
form.inline { display:inline-flex; gap:6px; align-items:center; }
.empty { color:var(--muted); padding:18px 0; }
</style>
</head>
<body>
<header><b>ONTYRA</b>
<nav>
{% for key, label, href in [("home","Overview","/ui/"),("review","Review","/ui/review"),("memories","Memories","/ui/memories"),("concepts","Concepts","/ui/concepts"),("recall","Recall","/ui/recall")] %}
<a href="{{ href }}" class="{{ 'on' if nav == key }}">{{ label }}</a>
{% endfor %}
</nav></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
