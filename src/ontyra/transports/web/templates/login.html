{% extends "base.html" %}
{% block body %}
<h1>Sign in</h1>
{% if not needed %}<p>This daemon does not require a sign-in. <a href="/ui/">Open the console</a>.</p>
{% else %}
<p>Paste a human credential's token (or the single-user token).</p>
{% if error %}<p><b>{{ error }}</b></p>{% endif %}
<form method="post" action="/ui/login">
  <label>Credential token <input type="password" name="token" autocomplete="off" required style="width:100%;max-width:32em"></label>
  <button type="submit">Sign in</button>
</form>
{% endif %}
{% endblock %}
