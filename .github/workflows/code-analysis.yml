name: Code Analysis with SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
          persist-credentials: false

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --extra embedded --extra mcp

      # Unit and integration tests. The integration suite uses the embedded SurrealDB
      # engine and, for server mode, Docker (available on GitHub-hosted runners).
      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit_test tests/integration_test \
            --cov=src --cov-report=xml:coverage.xml

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
